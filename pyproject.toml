[tool.pytest.ini_options]
pythonpath = ["./lmat-cas-client/lmat_cas_client"]
addopts = "-n auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]

extend-select = [
    # imports
    "I",
    "F401",
    # single newline at end of file
    "W292",
    "W391",
    # unneeded whitespace
    "W291",
    "W293",
]

extend-ignore = ["F405", "F403"]

extend-safe-fixes = ["W291"]

[tool.mypy]

check_untyped_defs = true
cache_fine_grained = true
enable_error_code = ["explicit-override", "override"]

[[tool.mypy.overrides]]

module = ["sympy.*", "jsonpickle.*", "antlr4.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]

module = [ "lmat_cas_client.compiling.antlr.ExprGrammar", "lmat_cas_client.compiling.antlr.ExprLexer" ]
disable_error_code = [
	"import-untyped",
	"name-defined",
	"misc",
	"has-type",
	"attr-defined",
	"assignment",
	"var-annotated",
	"arg-type",
	"index",
]
follow_untyped_imports = true
